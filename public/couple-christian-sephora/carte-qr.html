<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carte QR | Christian et Sephora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="../assets/img/logo.jpg" />
    <link rel="stylesheet" href="./guest-qr-page.css" />
  </head>
  <body class="guest-qr-page">
    <main class="guest-qr-shell">
      <p class="qr-kicker">Carte privée · Hope Events</p>
      <section class="guest-qr-card"><img id="posterViewer" alt="Carte QR personnelle" /></section>
      <p class="qr-helper" id="qrHelper">Préparation de votre carte QR...</p>
      <div class="guest-qr-actions">
        <a id="openInvitationButton" class="guest-action is-primary"><span>Accéder à l'invitation</span></a>
        <a id="confirmPresenceButton" class="guest-action"><span>Confirmer ma présence</span></a>
        <a id="downloadCardButton" class="guest-action"><span>Télécharger la carte</span></a>
        <button id="shareQrPageButton" class="guest-action" type="button"><span>Partager</span></button>
      </div>
      <p class="guest-qr-feedback" id="guestQrFeedback" aria-live="polite"></p>
    </main>
    <script src="../assets/js/api.js"></script><script src="./universal-qr-card.js"></script>
  </body>
</html>
