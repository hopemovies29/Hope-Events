<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable</title>
    <script>
      document.write('<base href="' + (window.location.protocol === "file:" ? "./" : "/") + '">');
    </script>
    <script>
      (function () {
        var legacyPrefix = "/couple-christian-sephora/pomme rouge";
        var decodedPath = decodeURIComponent(window.location.pathname);

        if (decodedPath.toLowerCase().indexOf(legacyPrefix) !== 0) {
          return;
        }

        var suffix = decodedPath.slice(legacyPrefix.length);
        var canonicalPath = "/couple-christian-sephora/pomme%20Rouge" + suffix;
        window.location.replace(canonicalPath + window.location.search + window.location.hash);
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="home-page">
    <main class="not-found">
      <p class="eyebrow">404</p>
      <h1>Cette page n'existe pas.</h1>
      <p>Le lien est peut-etre incomplet ou l'invitation n'est plus disponible.</p>
      <a class="button button-primary" href="index.html">Retour a l'accueil</a>
    </main>
  </body>
</html>
